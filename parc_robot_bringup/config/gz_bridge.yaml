  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Float depth in metres; depth_converter.py republishes it as
# camera1/camera1/depth/image_rect_raw (16UC1, millimetres).
- ros_topic_name: "sim/camera1/depth/depth_image"
  gz_topic_name: "camera1_depth/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

